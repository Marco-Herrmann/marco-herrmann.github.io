<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation and Analysis of Cable Assemblies</title>
  <meta name="description" content="M. Herrmann, I. Cortes Garcia, S.R. Eugster — 29th Engineering Mechanics Symposium, Arnhem, 22–23 October 2026">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1d1f24;
      --muted: #5c606b;
      --border: #e2e2de;
      --accent: #c8102e; /* TU/e red */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171b;
        --surface: #1f2126;
        --text: #ecedf0;
        --muted: #a3a7b1;
        --border: #30333a;
        --accent: #ff5a6e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 16px 64px;
    }
    header {
      border-left: 4px solid var(--accent);
      padding-left: 20px;
      margin-bottom: 48px;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }
    .authors { font-weight: 600; margin: 0; }
    .affiliation, .venue { color: var(--muted); margin: 0; }
    .venue { margin-top: 12px; }
    .venue em { color: var(--text); font-style: italic; }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    figure {
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #4f5468;
    }
    figcaption {
      padding: 12px 16px;
      font-weight: 600;
      text-align: center;
    }
    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: inherit; }
    @media (max-width: 760px) {
      main { padding-top: 32px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="venue" style="margin: 0 0 8px;">Supplementary material to the poster</p>
      <h1>Simulation and Analysis of Cable Assemblies</h1>
      <p class="authors">M. Herrmann, I. Cortes Garcia, S.R. Eugster</p>
      <p class="affiliation">Eindhoven University of Technology</p>
      <p class="venue"><em>29th Engineering Mechanics Symposium</em><br>Hotel Papendal, Arnhem, 22–23 October 2026</p>
    </header>

    <section>
      <h2>Animated Eigenmodes</h2>
      <div class="grid">
        <figure>
          <img src="videos/AM_1_1.gif" alt="Animated eigenmode of cable assembly Design A" width="960" height="540">
          <figcaption>Design A</figcaption>
        </figure>
        <figure>
          <img src="videos/AM_3_1.gif" alt="Animated eigenmode of cable assembly Design B" width="960" height="540">
          <figcaption>Design B</figcaption>
        </figure>
        <figure>
          <img src="videos/AM_5_1.gif" alt="Animated eigenmode of cable assembly Design C" width="960" height="540">
          <figcaption>Design C</figcaption>
        </figure>
      </div>
    </section>

    <footer>
      <a href="../">&larr; Supplementary material</a>
    </footer>
  </main>
</body>
</html>
