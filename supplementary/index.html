<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplementary material — Marco Herrmann</title>
  <meta name="description" content="Supplementary material by Marco Herrmann, Eindhoven University of Technology">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1d1f24;
      --muted: #5c606b;
      --border: #e2e2de;
      --accent: #c8102e; /* TU/e red */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171b;
        --surface: #1f2126;
        --text: #ecedf0;
        --muted: #a3a7b1;
        --border: #30333a;
        --accent: #ff5a6e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 16px 64px;
    }
    header {
      border-left: 4px solid var(--accent);
      padding-left: 20px;
      margin-bottom: 48px;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      line-height: 1.15;
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }
    .affiliation { color: var(--muted); margin: 0; }
    h2 {
      font-size: 1.25rem;
      margin: 0 0 20px;
    }
    a.card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: var(--accent); }
    .card strong { display: block; }
    .card span { color: var(--muted); }
    footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Supplementary material</h1>
      <p class="affiliation">Marco Herrmann, Eindhoven University of Technology</p>
    </header>

    <section>
      <a class="card" href="EM_symposium_2026/">
        <strong>Simulation and Analysis of Cable Assemblies</strong>
        <span>Poster, 29th Engineering Mechanics Symposium, Arnhem, October 2026</span>
      </a>
      <a class="card" href="PosterSession_Udine_2026/">
        <strong>Simulation and Analysis of Cable Assemblies</strong>
        <span>Poster, CISM course, Udine, September–October 2026</span>
      </a>
    </section>

    <footer>
      <a href="../">&larr; Marco Herrmann</a>
    </footer>
  </main>
</body>
</html>
